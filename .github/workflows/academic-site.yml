name: Publish Hossein academic website
on:
  push:
    branches: [main]
    paths:
      - 'prepare_academic_site.py'
      - 'academic-assets/**'
      - '.github/workflows/academic-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hossein-academic-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean al-folio source
        run: python3 prepare_academic_site.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: _academic_source
      - name: Build website
        working-directory: _academic_source
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../_academic_output
      - name: Verify output
        run: |
          test -f _academic_output/index.html
          test -f _academic_output/publications/index.html
          grep -q 'Hossein' _academic_output/index.html
          grep -q 'Askari' _academic_output/index.html
          grep -q 'LFlow\|Latent Refinement' _academic_output/index.html
          if grep -qiE 'Jonathan T\. Barron|yadan_profile_new|Yadan_latest_Resume|G-YB1TEJT0Y8|罗雅丹' _academic_output/index.html; then exit 1; fi
          touch _academic_output/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _academic_output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
